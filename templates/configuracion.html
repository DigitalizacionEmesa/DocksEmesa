<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMESA DOCK - Configuración</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/breadcrumb.css">
  <style>
    .config-head {
      width: 100%;
      max-width: 980px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .config-head h1 {
      color: var(--color-primario-oscuro);
      font-size: 1.6rem;
      margin: 0;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 800px;
      margin: 24px auto 0;
    }

    .config-card {
      background: #fff;
      border: none;
      border-radius: 24px;
      min-height: 270px;
      padding: 28px 24px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      box-shadow: 0 10px 28px rgba(56, 128, 199, .10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      text-align: center;
      font-family: var(--font-main);
      color: var(--color-texto);
    }

    .config-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(56, 128, 199, .16);
    }

    .config-card .cc-icon {
      font-size: 72px;
      line-height: 1;
    }

    .config-card .cc-title {
      font-size: 24px;
      font-weight: 700;
      color: #4a7fb3;
      line-height: 1.2;
    }

    .config-card .cc-desc {
      display: none;
    }

    .config-card .cc-arrow {
      display: none;
    }

    .config-section-title {
      width: 100%;
      max-width: 980px;
      text-align: left;
      color: var(--color-primario-oscuro);
      font-size: 1.15rem;
      font-weight: 700;
      margin: 26px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .config-section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--color-card-border), transparent);
    }

    /* ================= RESPONSIVE CONFIGURACION (movil/tablet) ================= */
    @media (max-width: 1024px) {
      .config-head h1 { font-size: 1.4rem; }
      .config-grid { gap: 18px; }
      .config-section-title { font-size: 1.05rem; margin: 20px 0 10px 0; }
    }

    @media (max-width: 700px) {
      .config-head { flex-direction: column; align-items: stretch; gap: 10px; }
      .config-head h1 { font-size: 1.2rem; }
      .config-grid { grid-template-columns: 1fr; gap: 16px; }
      .config-card { min-height: 220px; }
      .config-section-title { font-size: 1rem; margin: 18px 0 8px 0; }
      .footer-info { display: none; }
    }
  </style>
</head>
<body>
  <div class="header"></div>
  <script src="/static/js/globalHeader.js" data-title="Configuración"></script>

  <!-- Breadcrumb EMESA (jerarquía Inicio > Configuración > Submenú) -->
  <nav class="breadcrumb-wrapper" aria-label="Breadcrumb">
    <div class="breadcrumb-container" id="breadcrumb"></div>
  </nav>

  <div class="main-container">
    <div class="config-head">
      <h1 data-original-text="Configuración del sistema">⚙️ Configuración del sistema</h1>
    </div>

    <!-- Secciones renderizadas por configuracion.js -->
    <div id="secciones"></div>

    <div class="footer-info">
      <p data-original-text="EMESA DOCK · Módulos de configuración">EMESA DOCK · Módulos de configuración</p>
      <p data-original-text="Datos gestionados en Supabase">Datos gestionados en Supabase</p>
    </div>
  </div>

  <script src="/static/js/navegacion.js"></script>
  <script src="/static/js/supabase.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/permisos.js"></script>
  <script src="/static/js/modulos.js"></script>
  <script src="/static/js/configuracion.js"></script>
  <script src="/static/js/breadcrumb.js"></script>
</body>
</html>
