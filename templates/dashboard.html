<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMESA DOCK - Gestión de Muelles</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/breadcrumb.css">
  <style>
    /* Estilos específicos del dashboard */
    .section-title {
      width: 100%;
      max-width: 900px;
      text-align: left;
      color: var(--color-primario-oscuro);
      font-size: 1.3rem;
      font-weight: 700;
      margin: 8px 0 4px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--color-card-border), transparent);
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 24px;
      font-size: 0.95rem;
    }

    .dock-status-bar {
      margin-top: 24px;
      width: 100%;
      max-width: 900px;
    }
  </style>
</head>
<body class="dashboard-page">
  <!-- Header global inyectado por globalHeader.js -->
  <div class="header"></div>
  <script src="/static/js/globalHeader.js" data-title="Gestión de Muelles"></script>

  <!-- Breadcrumb EMESA (jerarquía Inicio > Configuración > Submenú) -->
  <nav class="breadcrumb-wrapper" aria-label="Breadcrumb">
    <div class="breadcrumb-container" id="breadcrumb"></div>
  </nav>

  <div class="dashboard-shell">
    <aside class="app-sidebar" aria-label="Navegación principal">
      <nav class="sidebar-nav">
        <a class="sidebar-item" href="/dashboard" data-sidebar-route="/dashboard" aria-label="Inicio">
          <span class="sidebar-icon" aria-hidden="true">🏠</span><span class="sidebar-label" data-original-text="Inicio">Inicio</span>
        </a>
        <a class="sidebar-item" href="/reservas" data-sidebar-route="/reservas" aria-label="Reservar muelle">
          <span class="sidebar-icon" aria-hidden="true">🚛</span><span class="sidebar-label" data-original-text="Reservar muelle">Reservar muelle</span>
        </a>
        <a class="sidebar-item" href="/mis-reservas" data-sidebar-route="/mis-reservas" aria-label="Mis reservas">
          <span class="sidebar-icon" aria-hidden="true">📋</span><span class="sidebar-label" data-original-text="Mis reservas">Mis reservas</span>
        </a>
        <a id="sidebarCalendario" class="sidebar-item" href="/calendario" data-sidebar-route="/calendario" aria-label="Calendario">
          <span class="sidebar-icon" aria-hidden="true">📅</span><span class="sidebar-label" data-original-text="Calendario">Calendario</span>
        </a>
      </nav>
      <div class="config-container">
        <a id="tab-configuracion" class="btn-config" href="/configuracion" aria-label="Configuración">
          <span class="config-icon" aria-hidden="true">⚙️</span><span class="config-text" data-original-text="Configuración">Configuración</span>
        </a>
      </div>
    </aside>

    <main class="main-container dashboard-content">
    <!-- Estadísticas desde Supabase -->
    <h2 class="section-title" data-original-text="Resumen del día">📊 Resumen del día</h2>
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="statMuelles">--</div>
        <div class="stat-label" data-original-text="Muelles activos">Muelles activos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statReservasHoy">--</div>
        <div class="stat-label" data-original-text="Reservas hoy">Reservas hoy</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statPendientes">--</div>
        <div class="stat-label" data-original-text="Pendientes">Pendientes</div>
      </div>
    </div>

    <div class="footer-info">
      <p data-original-text="EMESA DOCK · Gestión de Muelles y Reservas">EMESA DOCK · Gestión de Muelles y Reservas</p>
      <p data-original-text="Conectado a Supabase">Conectado a Supabase</p>
    </div>
    </main>
  </div>

  <script src="/static/js/navegacion.js"></script>
  <script src="/static/js/supabase.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/permisos.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/breadcrumb.js"></script>

  <!-- Modal de login universal (se muestra si no hay sesión) -->
  <script src="/static/js/loginModal.js"></script>
</body>
</html>
