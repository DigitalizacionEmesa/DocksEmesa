<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMESA DOCK - Reserva de Muelles</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/breadcrumb.css">
  <style>
    .reserva-head {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .reserva-head h1 {
      color: var(--color-primario-oscuro);
      font-size: 1.6rem;
      margin: 0;
    }

    /* ---- Filtros en cascada ---- */
    .filtros {
      width: 100%;
      max-width: 1200px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: linear-gradient(160deg, #ffffff 0%, #eef6fd 100%);
      border: 2px solid var(--color-card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(41, 128, 199, 0.08);
    }
    .filtros label {
      font-weight: 700;
      color: var(--color-primario-oscuro);
      font-size: 0.9rem;
      margin-right: 4px;
    }
    .filtros select {
      min-width: 200px;
      flex: 1;
    }
    .filtros select:disabled {
      background: #f1f3f5;
      color: #999;
      cursor: not-allowed;
    }
    .filtros .filtro-aviso {
      width: 100%;
      color: #856404;
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
    }

    /* ---- Navegacion semanal ---- */
    .semana-nav {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .semana-nav .semana-titulo {
      font-weight: 700;
      color: var(--color-primario-oscuro);
      font-size: 1.05rem;
    }
    .semana-nav .btn { margin: 0; }
    .semana-nav .fecha-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .semana-nav .fecha-nav .btn-nav {
      background: var(--color-primario);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 40px;
      height: 42px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 1px 4px rgba(56, 128, 199, 0.2);
      transition: background 0.15s ease, transform 0.1s ease;
      flex-shrink: 0;
    }
    .semana-nav .fecha-nav .btn-nav:hover { background: var(--color-boton-hover); }
    .semana-nav .fecha-nav .btn-nav:active { transform: scale(0.94); }
    .semana-nav .fecha-nav .fecha-input-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .semana-nav .fecha-nav .fecha-input-wrap input[type="text"] {
      min-width: 132px;
      margin: 0;
      text-align: center;
      cursor: pointer;
      background: #fff;
      font-weight: 600;
      color: var(--color-primario-oscuro);
      letter-spacing: 0.3px;
    }
    .semana-nav .fecha-nav .fecha-input-wrap input[type="date"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      margin: 0;
      padding: 0;
    }

    /* ---- Leyenda ---- */
    .leyenda {
      width: 100%;
      max-width: 1200px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #555;
    }
    .leyenda .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* ---- Calendario ---- */
    .calendario-wrap {
      width: 100%;
      max-width: 1200px;
      overflow-x: auto;
      background: #fff;
      border: 2px solid var(--color-card-border);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(41, 128, 199, 0.08);
    }
    .dia-pasado-aviso {
      width: 100%; max-width: 1200px; box-sizing: border-box;
      color: #5f6b76; background: #eceff1; border: 1px dashed #9aa5b1;
      border-radius: 10px; padding: 9px 14px; margin-bottom: 10px;
      font-size: 0.9rem; font-weight: 600; text-align: center;
    }
    .oculto { display: none; }
    .calendario-wrap.dia-pasado td.libre {
      background: repeating-linear-gradient(45deg, #f1f3f5, #f1f3f5 4px, #e6e9ed 4px, #e6e9ed 8px) !important;
      cursor: not-allowed !important;
      color: transparent;
    }
    .calendario-wrap.dia-pasado td.libre::after {
      content: '\2014';
      color: #aab2bd;
      font-size: 0.65rem;
    }
    .calendario-wrap.dia-pasado td.libre:hover {
      background: repeating-linear-gradient(45deg, #f1f3f5, #f1f3f5 4px, #e6e9ed 4px, #e6e9ed 8px) !important;
      box-shadow: none !important;
    }
    #calendario {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 760px;
    }
    #calendario th, #calendario td {
      border: 1px solid #e3e8ee;
      padding: 0;
      text-align: center;
      font-size: 0.72rem;
      vertical-align: middle;
    }
    #calendario th.hora-col {
      width: 56px;
      background: #f4f7fa;
      color: #555;
      font-weight: 700;
      padding: 6px;
      position: sticky;
      left: 0;
      z-index: 2;
    }
    #calendario th.muelle-col {
      background: linear-gradient(160deg, #eef6fd 0%, #dcecf9 100%);
      color: var(--color-primario-oscuro);
      font-weight: 700;
      padding: 8px 4px;
      line-height: 1.3;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #calendario th.muelle-col .sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #5b7893;
    }
    #calendario th.dia-col {
      background: #f0f5fa;
      color: #3a6b8f;
      font-weight: 600;
      padding: 4px 2px;
      font-size: 0.68rem;
    }
    #calendario th.dia-col.hoy {
      background: linear-gradient(160deg, #ffe0b2 0%, #ffcc80 100%);
      color: #7a4a00;
    }
    #calendario td.hora {
      background: #fafbfc;
      color: #666;
      font-weight: 600;
      padding: 3px;
      position: sticky;
      left: 0;
      z-index: 1;
      background: #f4f7fa;
    }
    #calendario td.celda {
      height: 30px;
      cursor: pointer;
      transition: background 0.15s ease;
      min-width: 52px;
    }
    #calendario td.ocupado {
      background: #ffebee;
      cursor: default;
    }
    #calendario td.ocupado:hover { background: #ffebee; }
    #calendario td.libre {
      background: #e8f5e9;
    }
    #calendario td.libre:hover {
      background: #c8e6c9;
      box-shadow: inset 0 0 0 2px #66bb6a;
    }
    #calendario td.cerrado {
      background: #f1f3f5;
      cursor: default;
      color: #bbb;
      font-size: 0.65rem;
    }
    .celda-reserva {
      display: block;
      padding: 2px 3px;
      font-size: 0.66rem;
      font-weight: 600;
      line-height: 1.15;
      border-radius: 4px;
      margin: 2px;
      color: #b71c1c;
      background: #ffcdd2;
      border: 1px solid #ef9a9a;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .celda-reserva .tipo {
      opacity: 0.75;
      font-weight: 400;
    }

    /* ---- Modal reserva ---- */
    .crud-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      padding: 20px;
    }
    .crud-modal-overlay.active { opacity: 1; visibility: visible; }
    .crud-modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
      transform: translateY(20px) scale(0.98);
      transition: transform 0.25s ease;
    }
    .crud-modal-overlay.active .crud-modal { transform: translateY(0) scale(1); }
    .crud-modal-head {
      background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
      color: #fff;
      padding: 18px 22px;
      border-radius: 16px 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .crud-modal-head h3 { margin: 0; font-size: 1.15rem; }
    .crud-modal-close {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .crud-modal-body { padding: 22px; }
    .crud-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
    .crud-form-grid .full { grid-column: 1 / -1; }
    .crud-form-grid label { display: block; margin-bottom: 4px; font-weight: 600; color: #333; font-size: 0.9rem; }
    .crud-form-grid input, .crud-form-grid select, .crud-form-grid textarea { margin-bottom: 12px; }
    .crud-form-grid input[readonly] { background: #f1f3f5; }
    .crud-modal-foot { padding: 0 22px 22px 22px; display: flex; justify-content: flex-end; gap: 12px; }
    @media (max-width: 600px) { .crud-form-grid { grid-template-columns: 1fr; } }

    .empty-state { text-align: center; color: #888; padding: 30px; font-size: 0.95rem; }

    /* ================= RESPONSIVE MOVIL / TABLET ================= */

    /* Tablets */
    @media (max-width: 1024px) and (min-width: 701px) {
      .filtros select { min-width: 150px; }
      #calendario td.celda { height: 38px; }
      #calendario th.muelle-col { font-size: 0.8rem; }
      /* Modal de reserva mas comodo en tablet */
      .crud-modal { max-width: 500px; }
    }

    /* Movil */
    @media (max-width: 700px) {
      .main-container { padding: 0 0 24px; }
      .reserva-head, .filtros, .semana-nav, .leyenda, .calendario-wrap {
        width: 100%; border-radius: 0; border-left: none; border-right: none;
      }

      /* Barra superior fija (titulo) */
      .reserva-head {
        position: sticky; top: 0; z-index: 55;
        background: #fff; margin: 0; padding: 12px 16px;
        border-bottom: 1px solid #eef1f5; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        justify-content: space-between;
      }
      .reserva-head h1 { font-size: 1.15rem; }

      /* Filtros apilados */
      .filtros {
        flex-direction: column; align-items: stretch; gap: 6px;
        padding: 12px 14px; margin-bottom: 10px;
      }
      .filtros > div:not(.filtro-aviso) { display: flex; align-items: center; gap: 10px; }
      .filtros label { min-width: 64px; font-size: 0.85rem; }
      .filtros select { flex: 1; min-width: 0; min-height: 44px; font-size: 0.95rem; }

      /* Fecha */
      .semana-nav { margin-bottom: 10px; }
      .semana-nav .semana-titulo { font-size: 1rem; }
      .semana-nav .fecha-nav { flex: 1; min-width: 0; }
      .semana-nav .fecha-nav .btn-nav { width: 46px; height: 44px; font-size: 1.15rem; }
      .semana-nav .fecha-nav .fecha-input-wrap { flex: 1; min-width: 0; }
      .semana-nav .fecha-nav .fecha-input-wrap input[type="text"] { width: 100%; min-width: 0; min-height: 44px; font-size: 0.95rem; }
      .semana-nav .btn { min-height: 44px; padding: 0 18px; }

      /* Leyenda */
      .leyenda { gap: 8px 16px; font-size: 0.78rem; padding: 0 4px; }

      /* Grid: celdas altas para tocar */
      .calendario-wrap { -webkit-overflow-scrolling: touch; }
      #calendario { min-width: 480px; }
      #calendario th.hora-col { width: 46px; }
      #calendario td.celda { height: 44px; min-width: 62px; }
      #calendario th.muelle-col { font-size: 0.8rem; padding: 10px 6px; }

      /* Modales como hojas inferiores + formulario que cabe en pantalla */
      .crud-modal-overlay { padding: 0; align-items: flex-end; }
      .crud-modal {
        width: 100%; max-width: 100%; max-height: 90vh; border-radius: 22px 22px 0 0;
        transform: translateY(100%); display: flex; flex-direction: column;
      }
      .crud-modal-overlay.active .crud-modal { transform: translateY(0); }
      .crud-modal::before {
        content: ''; display: block; width: 42px; height: 5px; border-radius: 3px;
        background: #d7dfe8; margin: 10px auto 0;
      }
      .crud-modal-head { border-radius: 22px 22px 0 0; padding: 12px 16px; flex-shrink: 0; }
      .crud-modal-body { padding: 12px 16px; overflow-y: auto; flex: 1; }
      .crud-form-grid { grid-template-columns: 1fr; gap: 0; }
      .crud-form-grid .full { grid-column: auto; }
      .crud-form-grid label { font-size: 0.85rem; margin-bottom: 3px; }
      .crud-form-grid input, .crud-form-grid select, .crud-form-grid textarea {
        min-height: 46px; font-size: 1rem; margin-bottom: 10px; box-sizing: border-box;
      }
      .crud-form-grid textarea { min-height: 76px; }
      .crud-form-grid input[readonly] { font-size: 0.95rem; }
      .crud-modal-foot {
        flex-direction: column; gap: 8px; flex-shrink: 0;
        padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
      }
      .crud-modal-foot .btn { width: 100%; min-height: 48px; margin: 0; font-size: 1rem; }

      .footer-info { display: none; }
    }
  </style>
</head>
<body>
  <div class="header"></div>
  <script src="/static/js/globalHeader.js" data-title="Reservas"></script>

  <nav class="breadcrumb-wrapper" aria-label="Breadcrumb">
    <div class="breadcrumb-container" id="breadcrumb"></div>
  </nav>

  <div class="main-container">
    <div class="reserva-head">
      <h1>📅 <span data-original-text="Reserva de Muelles">Reserva de Muelles</span></h1>
    </div>

    <!-- Filtros en cascada: Planta -> Nave (todas las naves o una) -->
    <div class="filtros" id="filtros">
      <div>
        <label for="filtroPlanta" data-original-text="Planta">Planta</label>
        <select id="filtroPlanta"></select>
      </div>
      <div>
        <label for="filtroNave" data-original-text="Nave">Nave</label>
        <select id="filtroNave" disabled></select>
      </div>
      <div id="filtroAviso" class="filtro-aviso" style="display:none;"></div>
    </div>

    <!-- Selector de fecha -->
    <div class="semana-nav">
      <span class="semana-titulo" id="fechaTitulo">—</span>
      <div class="fecha-nav">
        <label for="fechaSel" data-original-text="Fecha">Fecha</label>
        <button type="button" class="btn-nav" id="btnPrevDia" title="Día anterior" aria-label="Día anterior" data-original-title="Día anterior">◀</button>
        <div class="fecha-input-wrap">
          <input type="text" id="fechaSelTxt" readonly value="—" aria-label="Fecha seleccionada" title="Clic para elegir día" data-original-title="Clic para elegir día">
          <input type="date" id="fechaSel" tabindex="-1" aria-hidden="true">
        </div>
        <button type="button" class="btn-nav" id="btnNextDia" title="Día siguiente" aria-label="Día siguiente" data-original-title="Día siguiente">▶</button>
        <button class="btn" id="btnHoy" data-original-text="Hoy">Hoy</button>
      </div>
    </div>

    <!-- Leyenda -->
    <div class="leyenda">
      <span data-original-text="Libre (clic para reservar)"><span class="swatch" style="background:#e8f5e9;border:1px solid #66bb6a;"></span>Libre (clic para reservar)</span>
      <span data-original-text="Ocupado"><span class="swatch" style="background:#ffcdd2;border:1px solid #ef9a9a;"></span>Ocupado</span>
      <span data-original-text="Cerrado / sin horario"><span class="swatch" style="background:#f1f3f5;"></span>Cerrado / sin horario</span>
    </div>

    <!-- Aviso día pasado -->
    <div class="dia-pasado-aviso oculto" id="avisoDiaPasado" data-original-text="Día pasado · Solo lectura">Día pasado · Solo lectura</div>

    <!-- Calendario semanal -->
    <div class="calendario-wrap">
      <table id="calendario">
        <thead id="calHead"></thead>
        <tbody id="calBody">
          <tr><td colspan="8" class="empty-state" id="calLoading" data-original-text="Cargando calendario...">Cargando calendario...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer-info">
      <p data-original-text="EMESA DOCK · Reserva de muelles">EMESA DOCK · Reserva de muelles</p>
      <p data-original-text="Elige tu planta y nave para ver la ocupacion del dia">Elige tu planta y nave para ver la ocupacion del dia</p>
    </div>
  </div>

  <!-- Modal de reserva -->
  <div class="crud-modal-overlay" id="reservaModal">
    <div class="crud-modal">
      <div class="crud-modal-head">
        <h3 data-original-text="Nueva reserva">Nueva reserva</h3>
        <button class="crud-modal-close" id="reservaModalClose" title="Cerrar" data-original-title="Cerrar">✕</button>
      </div>
      <div class="crud-modal-body">
        <form id="reservaForm" class="crud-form-grid">
          <input type="hidden" id="r_muelle_id">
          <div class="crud-field">
            <label data-original-text="Muelle">Muelle</label>
            <input type="text" id="r_muelle" readonly>
          </div>
          <div class="crud-field">
            <label data-original-text="Fecha">Fecha</label>
            <input type="hidden" id="r_fecha_iso">
            <input type="text" id="r_fecha" readonly>
          </div>
          <div class="crud-field">
            <label data-original-text="Hora inicio">Hora inicio</label>
            <input type="time" id="r_hora_inicio" readonly>
          </div>
          <div class="crud-field">
            <label data-original-text="Hora fin">Hora fin</label>
            <input type="time" id="r_hora_fin" readonly>
          </div>
          <div class="crud-field">
            <label data-original-text="Tipo de operacion">Tipo de operacion</label>
            <select id="r_tipo">
              <option value="descarga" data-original-text="Descarga">Descarga</option>
              <option value="carga" data-original-text="Carga">Carga</option>
            </select>
          </div>
          <div class="crud-field full">
            <label data-original-text="Observaciones">Observaciones</label>
            <textarea id="r_observaciones" rows="3" placeholder="Opcional" data-original-placeholder="Opcional"></textarea>
          </div>
        </form>
      </div>
      <div class="crud-modal-foot">
        <button type="button" class="btn" id="reservaCancelar" data-original-text="Cancelar">Cancelar</button>
        <button type="submit" form="reservaForm" class="btn btn-exito" id="reservaGuardar" data-original-text="Reservar">Reservar</button>
      </div>
    </div>
  </div>

  <script src="/static/js/navegacion.js"></script>
  <script src="/static/js/supabase.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/permisos.js"></script>
  <script src="/static/js/reservas.js"></script>
  <script src="/static/js/breadcrumb.js"></script>
</body>
</html>
